# Accepted Trivy findings. Each entry needs a reason: an untracked failure is
# worse than no scan at all.
misconfigurations:
  # BearerTokenAuth rejects every request when salon.api_token is empty, so the
  # demo image needs a token to exist. It is a placeholder for a portfolio
  # project, not a credential, and it is not a GitHub secret.
  - id: DS-0031
    paths:
      - Dockerfile
    statement: >-
      Placeholder token for a portfolio demo, required for the API to function.
      Never a real credential. Override it at runtime with -e API_TOKEN=...
