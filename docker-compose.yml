services:
  app:
    build:
      context: .
    image: beauty-salon-api
    container_name: salon_app
    ports:
      - "8081:8080"
    environment:
      - API_TOKEN=${API_TOKEN:-demo-token-for-portfolio}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
